<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="tunnelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34C759"/>
      <stop offset="0.5" stop-color="#30B0C7"/>
      <stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34C759"/>
      <stop offset="0.5" stop-color="#30B0C7"/>
      <stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="ahAmber" markerWidth="13" markerHeight="13" refX="9" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#D97706"/>
    </marker>
    <marker id="ahDark" markerWidth="13" markerHeight="13" refX="9" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#334155"/>
    </marker>
    <marker id="ahBlue" markerWidth="13" markerHeight="13" refX="9" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#0EA5E9"/>
    </marker>
    <marker id="ahWhite" markerWidth="13" markerHeight="13" refX="9" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <!-- background card -->
  <rect x="20" y="20" width="1560" height="1040" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- title -->
  <text x="800" y="74" text-anchor="middle" font-size="42" font-weight="700" fill="#0F172A">How Blue Steal Works</text>
  <text x="800" y="110" text-anchor="middle" font-size="21" fill="#475569">Relaying the FIDO caBLE proximity beacon so a <tspan font-weight="600" fill="#1D4ED8">peer</tspan> signs in on behalf of the <tspan font-weight="600" fill="#0E7490">host</tspan></text>

  <!-- divider between the two physically separated locations -->
  <line x1="800" y1="205" x2="800" y2="835" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="3 9"/>
  <g transform="translate(800,832)">
    <rect x="-150" y="-2" width="300" height="34" rx="17" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="0" y="21" text-anchor="middle" font-size="15" fill="#64748B">↔  physically separated · any distance</text>
  </g>

  <!-- ===================== HOST PANEL ===================== -->
  <rect x="48" y="200" width="712" height="620" rx="20" fill="#ECFEFF" stroke="#67E8F9" stroke-width="2"/>
  <text x="78" y="244" font-size="26" font-weight="700" fill="#0E7490">HOST</text>
  <text x="170" y="244" font-size="17" fill="#155E75">· holds the real passkey (the victim)</text>

  <!-- host machine (outer-left) -->
  <g>
    <rect x="92" y="300" width="296" height="290" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#soft)"/>
    <!-- laptop glyph -->
    <g transform="translate(240,400)">
      <rect x="-66" y="-46" width="132" height="92" rx="7" fill="#1F2937"/>
      <rect x="-56" y="-36" width="112" height="72" rx="4" fill="#CBD5E1"/>
      <!-- tiny QR on screen -->
      <g transform="translate(-22,-30)" fill="#1F2937">
        <rect x="0" y="0" width="14" height="14"/><rect x="3" y="3" width="8" height="8" fill="#CBD5E1"/><rect x="5" y="5" width="4" height="4" fill="#1F2937"/>
        <rect x="30" y="0" width="14" height="14"/><rect x="33" y="3" width="8" height="8" fill="#CBD5E1"/><rect x="35" y="5" width="4" height="4" fill="#1F2937"/>
        <rect x="0" y="30" width="14" height="14"/><rect x="3" y="33" width="8" height="8" fill="#CBD5E1"/><rect x="5" y="35" width="4" height="4" fill="#1F2937"/>
        <rect x="20" y="20" width="5" height="5"/><rect x="30" y="22" width="5" height="5"/><rect x="38" y="32" width="5" height="5"/><rect x="22" y="38" width="5" height="5"/>
      </g>
      <polygon points="-84,52 84,52 98,66 -98,66" fill="#94A3B8"/>
    </g>
    <text x="240" y="512" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Host machine</text>
    <text x="240" y="538" text-anchor="middle" font-size="14.5" fill="#475569">Receives the QR code by</text>
    <text x="240" y="558" text-anchor="middle" font-size="14.5" fill="#475569">email / Teams · displays it</text>
  </g>

  <!-- host phone w/ Blue Steal (inner-right) -->
  <g>
    <rect x="440" y="300" width="296" height="290" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#soft)"/>
    <!-- phone glyph -->
    <g transform="translate(588,398)">
      <rect x="-40" y="-74" width="80" height="148" rx="15" fill="#1F2937"/>
      <rect x="-33" y="-62" width="66" height="124" rx="8" fill="#E5F6FB"/>
      <rect x="-9" y="-69" width="18" height="5" rx="2.5" fill="#0B1220"/>
      <!-- BLE beacon waves emitting -->
      <g stroke="#0EA5E9" stroke-width="3" fill="none" opacity="0.9">
        <path d="M44,-18 a16,16 0 0 1 0,36"/>
        <path d="M52,-30 a28,28 0 0 1 0,60"/>
      </g>
    </g>
    <!-- Blue Steal badge -->
    <g transform="translate(704,318)">
      <circle r="19" fill="url(#badgeGrad)"/>
      <circle r="12.5" fill="none" stroke="#FFFFFF" stroke-width="3.4"/>
      <polygon points="0,-9 -4.5,-2 4.5,-2" fill="#FFFFFF"/>
      <polygon points="0,9 -4.5,2 4.5,2" fill="#FFFFFF"/>
    </g>
    <text x="588" y="512" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Host phone · Blue Steal</text>
    <text x="588" y="538" text-anchor="middle" font-size="14.5" fill="#475569">Scans the QR with the passkey,</text>
    <text x="588" y="558" text-anchor="middle" font-size="14.5" fill="#475569">emits the BLE beacon → captures it,</text>
    <text x="588" y="578" text-anchor="middle" font-size="14.5" fill="#475569">hosts the tunnel, shares the token</text>
    <g transform="translate(588,614)">
      <rect x="-150" y="-15" width="300" height="30" rx="15" fill="#CFFAFE" stroke="#67E8F9" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="600" fill="#0E7490">capture-only · any platform, incl. iOS</text>
    </g>
  </g>

  <!-- ===================== PEER PANEL ===================== -->
  <rect x="840" y="200" width="712" height="620" rx="20" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <text x="872" y="244" font-size="26" font-weight="700" fill="#1D4ED8">PEER</text>
  <text x="966" y="244" font-size="17" fill="#1E40AF">· ends up logged in (the attacker)</text>

  <!-- peer device w/ Blue Steal (inner-left) -->
  <g>
    <rect x="864" y="300" width="296" height="290" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#soft)"/>
    <!-- generic device glyph (tablet/dongle) -->
    <g transform="translate(1012,398)">
      <rect x="-44" y="-70" width="88" height="140" rx="14" fill="#1F2937"/>
      <rect x="-36" y="-58" width="72" height="116" rx="7" fill="#E5F6FB"/>
      <!-- BLE beacon waves broadcasting (to the right, toward the machine) -->
      <g stroke="#0EA5E9" stroke-width="3" fill="none" opacity="0.95">
        <path d="M48,-18 a16,16 0 0 1 0,36"/>
        <path d="M56,-30 a28,28 0 0 1 0,60"/>
        <path d="M64,-42 a40,40 0 0 1 0,84"/>
      </g>
    </g>
    <g transform="translate(1128,318)">
      <circle r="19" fill="url(#badgeGrad)"/>
      <circle r="12.5" fill="none" stroke="#FFFFFF" stroke-width="3.4"/>
      <polygon points="0,-9 -4.5,-2 4.5,-2" fill="#FFFFFF"/>
      <polygon points="0,9 -4.5,2 4.5,2" fill="#FFFFFF"/>
    </g>
    <text x="1012" y="512" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Peer device · Blue Steal</text>
    <text x="1012" y="538" text-anchor="middle" font-size="14.5" fill="#475569">Joins the tunnel and</text>
    <text x="1012" y="558" text-anchor="middle" font-size="14.5" fill="#475569">re-broadcasts the BLE beacon</text>
    <text x="1012" y="578" text-anchor="middle" font-size="14.5" fill="#475569">next to the machine</text>
    <g transform="translate(1012,614)">
      <rect x="-150" y="-15" width="300" height="30" rx="15" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="600" fill="#1D4ED8">re-broadcasts · Windows · macOS · Android</text>
    </g>
  </g>

  <!-- peer machine (outer-right) -->
  <g>
    <rect x="1212" y="300" width="296" height="290" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#soft)"/>
    <g transform="translate(1360,400)">
      <rect x="-66" y="-46" width="132" height="92" rx="7" fill="#1F2937"/>
      <rect x="-56" y="-36" width="112" height="72" rx="4" fill="#CBD5E1"/>
      <!-- QR being generated on screen -->
      <g transform="translate(-22,-30)" fill="#1F2937">
        <rect x="0" y="0" width="14" height="14"/><rect x="3" y="3" width="8" height="8" fill="#CBD5E1"/><rect x="5" y="5" width="4" height="4" fill="#1F2937"/>
        <rect x="30" y="0" width="14" height="14"/><rect x="33" y="3" width="8" height="8" fill="#CBD5E1"/><rect x="35" y="5" width="4" height="4" fill="#1F2937"/>
        <rect x="0" y="30" width="14" height="14"/><rect x="3" y="33" width="8" height="8" fill="#CBD5E1"/><rect x="5" y="35" width="4" height="4" fill="#1F2937"/>
        <rect x="20" y="20" width="5" height="5"/><rect x="30" y="22" width="5" height="5"/><rect x="38" y="32" width="5" height="5"/><rect x="22" y="38" width="5" height="5"/>
      </g>
      <polygon points="-84,52 84,52 98,66 -98,66" fill="#94A3B8"/>
    </g>
    <text x="1360" y="512" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Peer machine</text>
    <text x="1360" y="538" text-anchor="middle" font-size="14.5" fill="#475569">Starts a genuine sign-in →</text>
    <text x="1360" y="558" text-anchor="middle" font-size="14.5" fill="#475569">generates the QR; later hears the</text>
    <text x="1360" y="578" text-anchor="middle" font-size="14.5" fill="#475569">beacon → logs in as the host</text>
  </g>

  <!-- relying party cloud (talks to peer machine) -->
  <g transform="translate(1470,232)">
    <path d="M-34,8 a16,16 0 0 1 4,-31 a22,22 0 0 1 42,3 a15,15 0 0 1 -2,28 Z" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.6"/>
    <text x="2" y="2" text-anchor="middle" font-size="11.5" fill="#1E40AF">genuine</text>
    <text x="2" y="14" text-anchor="middle" font-size="11.5" fill="#1E40AF">site</text>
  </g>
  <line x1="1432" y1="248" x2="1392" y2="300" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- ============ STEP 2: QR transfer (peer machine → host machine, over the top) ============ -->
  <path d="M1360,300 C1360,150 980,150 800,150 C620,150 240,150 240,300"
        fill="none" stroke="#D97706" stroke-width="3.5" stroke-dasharray="9 7" marker-end="url(#ahAmber)"/>
  <g transform="translate(800,150)">
    <rect x="-150" y="-26" width="300" height="44" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2"/>
    <!-- envelope glyph -->
    <g transform="translate(-122,-4)" stroke="#D97706" stroke-width="2" fill="none">
      <rect x="-14" y="-9" width="28" height="19" rx="2.5" fill="#FEF3C7"/>
      <polyline points="-14,-8 0,4 14,-8"/>
    </g>
    <text x="14" y="0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#92400E">Send the QR code</text>
    <text x="14" y="14" text-anchor="middle" font-size="12.5" fill="#B45309">by email / Teams</text>
  </g>

  <!-- ============ STEP 3: scan (host machine → host phone) ============ -->
  <path d="M392,420 C418,420 416,420 436,420" fill="none" stroke="#334155" stroke-width="3.5" marker-end="url(#ahDark)"/>
  <text x="414" y="402" text-anchor="middle" font-size="13" fill="#334155">scan</text>

  <!-- ============ STEP 5: caBLE tunnel relay (host phone → peer device), the hero ============ -->
  <!-- bridges the two Blue Steal devices at mid-height, crossing the divider -->
  <path d="M738,452 L860,452" stroke="url(#tunnelGrad)" stroke-width="24" stroke-linecap="round" marker-end="url(#ahWhite)"/>
  <g transform="translate(800,452)">
    <rect x="-214" y="36" width="428" height="62" rx="14" fill="#0F172A"/>
    <text x="0" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Relay over the public caBLE tunnel</text>
    <text x="0" y="82" text-anchor="middle" font-size="13.5" fill="#93C5FD">cable.ua5v.com — FIDO’s own server is the side channel</text>
  </g>
  <text x="800" y="430" text-anchor="middle" font-size="13" fill="#334155">beacon bytes: host → peer</text>

  <!-- ============ STEP 6: re-broadcast (peer device → peer machine) ============ -->
  <path d="M1162,470 C1186,470 1188,470 1208,470" fill="none" stroke="#0EA5E9" stroke-width="3.5" marker-end="url(#ahBlue)"/>
  <text x="1185" y="452" text-anchor="middle" font-size="13" fill="#0369A1">BLE</text>

  <!-- ============ step number badges ============ -->
  <!-- 1: peer machine generates QR -->
  <g transform="translate(1238,322)"><circle r="17" fill="#111827"/><text y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">1</text></g>
  <!-- 2: QR transfer (on the arc, left of envelope) -->
  <g transform="translate(560,150)"><circle r="17" fill="#111827"/><text y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">2</text></g>
  <!-- 3: scan -->
  <g transform="translate(414,360)"><circle r="15" fill="#111827"/><text y="5" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text></g>
  <!-- 4: host phone captures + hosts -->
  <g transform="translate(472,318)"><circle r="17" fill="#111827"/><text y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">4</text></g>
  <!-- 5: tunnel relay -->
  <g transform="translate(800,452)"><circle r="17" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/><text y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">5</text></g>
  <!-- 6: re-broadcast -->
  <g transform="translate(1185,420)"><circle r="15" fill="#111827"/><text y="5" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">6</text></g>
  <!-- 7: proximity passes -->
  <g transform="translate(1452,562)"><circle r="17" fill="#16A34A"/><text y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">7</text></g>

  <!-- ============ outcome footer ============ -->
  <rect x="48" y="895" width="1504" height="150" rx="16" fill="#FEF2F2" stroke="#FECACA" stroke-width="2"/>
  <text x="78" y="940" font-size="20" font-weight="700" fill="#B91C1C">Net effect</text>
  <text x="78" y="972" font-size="16.5" fill="#7F1D1D">The “you must be in the room” Bluetooth proximity check is satisfied remotely. The host’s passkey signs the peer’s session at the</text>
  <text x="78" y="996" font-size="16.5" fill="#7F1D1D">genuine site — WebAuthn origin binding still holds, but the co-location assumption no longer does.</text>
  <text x="78" y="1026" font-size="13.5" fill="#9F1239" font-style="italic">Proof-of-concept for responsible disclosure — see docs/caBLE-proximity-relay-disclosure.md</text>
</svg>
