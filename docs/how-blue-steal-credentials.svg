<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="tunnelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34C759"/>
      <stop offset="0.5" stop-color="#30B0C7"/>
      <stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34C759"/>
      <stop offset="0.5" stop-color="#30B0C7"/>
      <stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="ahAmber" markerWidth="13" markerHeight="13" refX="9" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#D97706"/>
    </marker>
    <marker id="ahDark" markerWidth="12" markerHeight="12" refX="8" refY="5.5" orient="auto">
      <path d="M1,1 L10,5.5 L1,10 Z" fill="#334155"/>
    </marker>
    <marker id="ahBlue" markerWidth="12" markerHeight="12" refX="8" refY="5.5" orient="auto">
      <path d="M1,1 L10,5.5 L1,10 Z" fill="#0EA5E9"/>
    </marker>
  </defs>

  <!-- background card -->
  <rect x="20" y="20" width="1560" height="1040" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- title -->
  <text x="800" y="92" text-anchor="middle" font-size="42" font-weight="700" fill="#0F172A">How Blue Steal Works<tspan font-size="26" font-weight="600" fill="#475569"> — Digital Credentials</tspan></text>

  <!-- divider between the two physically separated locations -->
  <line x1="800" y1="205" x2="800" y2="815" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="3 9"/>

  <!-- ===================== HOST PANEL ===================== -->
  <rect x="48" y="200" width="712" height="615" rx="20" fill="#ECFEFF" stroke="#67E8F9" stroke-width="2"/>
  <text x="78" y="242" font-size="26" font-weight="700" fill="#0E7490">HOST</text>
  <text x="170" y="242" font-size="17" fill="#155E75">· stands at the verifier (colluding)</text>

  <!-- verifier / reader (outer-left) -->
  <g transform="translate(0,-24)">
    <rect x="80" y="300" width="280" height="275" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#soft)"/>
    <g transform="translate(220,398)">
      <rect x="-64" y="-44" width="128" height="88" rx="7" fill="#1F2937"/>
      <rect x="-54" y="-34" width="108" height="68" rx="4" fill="#CBD5E1"/>
      <g transform="translate(-21,-29)" fill="#1F2937">
        <rect x="0" y="0" width="13" height="13"/><rect x="3" y="3" width="7" height="7" fill="#CBD5E1"/><rect x="5" y="5" width="3" height="3" fill="#1F2937"/>
        <rect x="29" y="0" width="13" height="13"/><rect x="32" y="3" width="7" height="7" fill="#CBD5E1"/><rect x="34" y="5" width="3" height="3" fill="#1F2937"/>
        <rect x="0" y="29" width="13" height="13"/><rect x="3" y="32" width="7" height="7" fill="#CBD5E1"/><rect x="5" y="34" width="3" height="3" fill="#1F2937"/>
        <rect x="20" y="19" width="5" height="5"/><rect x="29" y="21" width="5" height="5"/><rect x="36" y="31" width="5" height="5"/><rect x="21" y="37" width="5" height="5"/>
      </g>
      <polygon points="-82,50 82,50 95,64 -95,64" fill="#94A3B8"/>
    </g>
    <text x="220" y="500" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Verifier</text>
    <text x="220" y="526" text-anchor="middle" font-size="14" fill="#475569">Requests a credential,</text>
    <text x="220" y="545" text-anchor="middle" font-size="14" fill="#475569">shows the QR to scan</text>
  </g>

  <!-- host phone · relay (inner-right) -->
  <g transform="translate(0,-24)">
    <rect x="450" y="300" width="270" height="275" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#soft)"/>
    <g transform="translate(585,392)">
      <rect x="-38" y="-72" width="76" height="144" rx="15" fill="#1F2937"/>
      <rect x="-31" y="-60" width="62" height="120" rx="8" fill="#E5F6FB"/>
      <rect x="-9" y="-67" width="18" height="5" rx="2.5" fill="#0B1220"/>
      <!-- engaging the verifier on the left (scan + hybrid handshake) -->
      <g stroke="#0EA5E9" stroke-width="3" fill="none" opacity="0.9">
        <path d="M-44,-16 a16,16 0 0 0 0,32"/>
        <path d="M-52,-28 a28,28 0 0 0 0,56"/>
      </g>
    </g>
    <g transform="translate(700,320)">
      <circle r="18" fill="url(#badgeGrad)"/>
      <circle r="12" fill="none" stroke="#FFFFFF" stroke-width="3.2"/>
      <polygon points="0,-8.5 -4.2,-2 4.2,-2" fill="#FFFFFF"/>
      <polygon points="0,8.5 -4.2,2 4.2,2" fill="#FFFFFF"/>
    </g>
    <text x="585" y="500" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0F172A">Host phone · relay</text>
    <text x="585" y="525" text-anchor="middle" font-size="14" fill="#475569">Scans the QR, relays it</text>
    <text x="585" y="544" text-anchor="middle" font-size="14" fill="#475569">over the hybrid tunnel</text>
  </g>
  <!-- host platform qualifier -->
  <g transform="translate(585,574)">
    <rect x="-150" y="-15" width="300" height="30" rx="15" fill="#CFFAFE" stroke="#67E8F9" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="600" fill="#0E7490">device engagement · QR + BLE proximity</text>
  </g>

  <!-- ===================== PEER PANEL ===================== -->
  <rect x="840" y="200" width="712" height="615" rx="20" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <text x="872" y="242" font-size="26" font-weight="700" fill="#1D4ED8">PEER</text>
  <text x="966" y="242" font-size="17" fill="#1E40AF">· supplies the digital identity (remote)</text>

  <!-- peer phone · wallet (inner-left) -->
  <g transform="translate(0,-24)">
    <rect x="920" y="300" width="270" height="275" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#soft)"/>
    <g transform="translate(1055,392)">
      <rect x="-38" y="-72" width="76" height="144" rx="15" fill="#1F2937"/>
      <rect x="-31" y="-60" width="62" height="120" rx="8" fill="#E5F6FB"/>
      <rect x="-9" y="-67" width="18" height="5" rx="2.5" fill="#0B1220"/>
      <!-- a credential card sitting in the wallet -->
      <g transform="translate(0,-6)">
        <rect x="-20" y="-13" width="40" height="27" rx="3.5" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
        <circle cx="-10" cy="-3" r="4.5" fill="#1D4ED8"/>
        <line x1="-2" y1="-5" x2="13" y2="-5" stroke="#1D4ED8" stroke-width="1.6"/>
        <line x1="-2" y1="0" x2="13" y2="0" stroke="#60A5FA" stroke-width="1.6"/>
        <line x1="-15" y1="8" x2="13" y2="8" stroke="#60A5FA" stroke-width="1.6"/>
      </g>
    </g>
    <g transform="translate(1170,320)">
      <circle r="18" fill="url(#badgeGrad)"/>
      <circle r="12" fill="none" stroke="#FFFFFF" stroke-width="3.2"/>
      <polygon points="0,-8.5 -4.2,-2 4.2,-2" fill="#FFFFFF"/>
      <polygon points="0,8.5 -4.2,2 4.2,2" fill="#FFFFFF"/>
    </g>
    <text x="1055" y="500" text-anchor="middle" font-size="16.5" font-weight="700" fill="#0F172A">Peer phone · wallet</text>
    <text x="1055" y="525" text-anchor="middle" font-size="14" fill="#475569">Receives the request,</text>
    <text x="1055" y="544" text-anchor="middle" font-size="14" fill="#475569">signs with the credential</text>
  </g>
  <!-- peer platform qualifier -->
  <g transform="translate(1055,574)">
    <rect x="-152" y="-15" width="304" height="30" rx="15" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="600" fill="#1D4ED8">OpenID4VP · mdoc / SD-JWT VC</text>
  </g>

  <!-- peer's digital ID card (outer-right) -->
  <g transform="translate(0,-24)">
    <rect x="1260" y="300" width="280" height="275" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#soft)"/>
    <g transform="translate(1400,398)">
      <rect x="-96" y="-60" width="192" height="120" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
      <path d="M-96,-50 a10,10 0 0 1 10,-10 h172 a10,10 0 0 1 10,10 v8 h-192 Z" fill="#1D4ED8"/>
      <text x="0" y="-52" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">DIGITAL ID · mDL / VC</text>
      <!-- portrait -->
      <rect x="-84" y="-30" width="52" height="64" rx="4" fill="#E8EEF4" stroke="#CBD5E1" stroke-width="1.5"/>
      <g transform="translate(-58,-6)" fill="#94A3B8">
        <circle cx="0" cy="-6" r="8"/>
        <path d="M-13,16 a13,13 0 0 1 26,0 Z"/>
      </g>
      <!-- claims -->
      <text x="-20" y="-28" font-size="8.5" fill="#94A3B8" letter-spacing="0.5">GIVEN NAME</text>
      <text x="-20" y="-15" font-size="12.5" font-weight="700" fill="#0F172A">Alex Other</text>
      <text x="-20" y="2" font-size="8.5" fill="#94A3B8" letter-spacing="0.5">CLAIM</text>
      <text x="-20" y="15" font-size="12.5" font-weight="700" fill="#0F172A">age_over_18 ✓</text>
      <text x="-20" y="32" font-size="8.5" fill="#94A3B8" letter-spacing="0.5">STATUS</text>
      <text x="-20" y="45" font-size="11.5" font-weight="700" fill="#16A34A">Valid ✓</text>
    </g>
    <text x="1400" y="500" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">Peer's digital ID</text>
    <text x="1400" y="526" text-anchor="middle" font-size="14" fill="#475569">the identity actually shown —</text>
    <text x="1400" y="545" text-anchor="middle" font-size="14" fill="#475569">not the person present</text>
  </g>

  <!-- tags above the two endpoints (panel-matched, like the genuine-site tags) -->
  <g transform="translate(220,306)">
    <rect x="-50" y="-14" width="100" height="28" rx="14" fill="#CFFAFE" stroke="#67E8F9" stroke-width="1.5"/>
    <g transform="translate(-30,0)">
      <circle r="7.5" fill="none" stroke="#0E7490" stroke-width="1.6"/>
      <path d="M-3.5,0 L-1,3 L4,-3.5" fill="none" stroke="#0E7490" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="8" y="4.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0E7490">Verifier</text>
  </g>

  <!-- ============ STEP 1->2: scan the verifier's QR (within HOST) ============ -->
  <path d="M368,370 L540,370" fill="none" stroke="#0EA5E9" stroke-width="3.5" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#ahBlue)"/>
  <text x="454" y="358" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0369A1">scans QR</text>

  <!-- ============ STEP 5: wallet selects & signs the chosen identity (within PEER) ============ -->
  <path d="M1124,370 L1300,370" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#ahDark)"/>
  <text x="1212" y="358" text-anchor="middle" font-size="12.5" fill="#334155">signs the VP</text>

  <!-- ============ STEP 7: the peer's identity reaches the verifier (over the top) ============ -->
  <path d="M1400,276 C1400,150 1000,150 800,150 C600,150 220,150 220,276"
        fill="none" stroke="#D97706" stroke-width="3.5" stroke-dasharray="9 7" marker-end="url(#ahAmber)"/>
  <g transform="translate(800,150)">
    <rect x="-178" y="-26" width="356" height="44" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2"/>
    <g transform="translate(-146,-2)">
      <path d="M0,-11 L11,9 L-11,9 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="2" stroke-linejoin="round"/>
      <rect x="-1.4" y="-4" width="2.8" height="7" rx="1.4" fill="#D97706"/>
      <circle cx="0" cy="6" r="1.6" fill="#D97706"/>
    </g>
    <text x="16" y="-3" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">Accepted as a present holder</text>
    <text x="16" y="13" text-anchor="middle" font-size="12.5" fill="#B45309">the wallet is remote — proximity was relayed</text>
  </g>

  <!-- ============ STEP 3 + 6: hybrid tunnel relay (request out, presentation back) ============ -->
  <path d="M648,754 L952,754" stroke="url(#tunnelGrad)" stroke-width="22" stroke-linecap="round"/>
  <g transform="translate(800,700)">
    <rect x="-238" y="-38" width="476" height="80" rx="14" fill="#0F172A"/>
    <text x="0" y="-15" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">hybrid tunnel — opened in setup, before step 1</text>
    <text x="0" y="5" text-anchor="middle" font-size="13" fill="#93C5FD">host phone hosts · peer phone joins with the shared token</text>
    <text x="0" y="27" text-anchor="middle" font-size="13" font-weight="600" fill="#E2E8F0">request  host → peer    ·    peer → host  presentation</text>
  </g>

  <!-- ============ step number badges ============ -->
  <!-- 1: verifier requests -->
  <g transform="translate(102,298)"><circle r="17" fill="#111827"/><text y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">1</text></g>
  <!-- 2: host scans the QR -->
  <g transform="translate(472,298)"><circle r="17" fill="#111827"/><text y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">2</text></g>
  <!-- 3: relay request down the tunnel -->
  <g transform="translate(690,788)"><circle r="17" fill="#111827"/><text y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">3</text></g>
  <!-- 4: peer phone receives -->
  <g transform="translate(942,298)"><circle r="17" fill="#111827"/><text y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">4</text></g>
  <!-- 5: wallet signs the chosen identity -->
  <g transform="translate(1282,298)"><circle r="17" fill="#111827"/><text y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">5</text></g>
  <!-- 6: return the presentation up the tunnel -->
  <g transform="translate(910,788)"><circle r="17" fill="#111827"/><text y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">6</text></g>
  <!-- 7: verifier accepts -->
  <g transform="translate(338,298)"><circle r="17" fill="#111827"/><text y="6" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">7</text></g>

  <!-- ============ outcome footer ============ -->
  <rect x="48" y="838" width="1504" height="210" rx="16" fill="#FEF2F2" stroke="#FECACA" stroke-width="2"/>
  <text x="78" y="878" font-size="20" font-weight="700" fill="#B91C1C">Net effect</text>
  <text x="78" y="910" font-size="16.5" fill="#7F1D1D">The hybrid proximity check is satisfied remotely, so the responding wallet need not be near the verifier. The person standing at the</text>
  <text x="78" y="934" font-size="16.5" fill="#7F1D1D">verifier presents a digital identity that belongs to someone else, yet the credential still verifies as genuine.</text>
  <text x="78" y="966" font-size="16.5" fill="#7F1D1D"><tspan font-weight="700" fill="#B91C1C">Mitigation:</tspan> the verifier must compare the portrait to the person, or match returned fields against values already on file —</text>
  <text x="78" y="988" font-size="16.5" fill="#7F1D1D">which reintroduces manual checks and erodes the convenience that makes remote digital-credential presentation worthwhile.</text>
  <text x="78" y="1024" font-size="14" fill="#9F1239"><tspan font-weight="700">Order:</tspan>  <tspan font-weight="700">1</tspan> verifier requests  ·  <tspan font-weight="700">2</tspan> host scans the QR  ·  <tspan font-weight="700">3</tspan> relay request  ·  <tspan font-weight="700">4</tspan> wallet receives  ·  <tspan font-weight="700">5</tspan> wallet signs the chosen identity  ·  <tspan font-weight="700">6</tspan> return presentation  ·  <tspan font-weight="700">7</tspan> verifier accepts</text>

  <!-- physically-separated pill (drawn last so it sits on top of the panels) -->
  <g transform="translate(800,450)">
    <rect x="-86" y="-16" width="172" height="32" rx="16" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="0" y="5" text-anchor="middle" font-size="12.5" fill="#64748B">↔ physically separated</text>
  </g>
</svg>
